<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#EE4D2D">
  <title>NEXO Financeiro — Nova senha</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body class="auth-page">
  <header class="nexo-topbar auth-topbar">
    <div class="nexo-brand"><span class="brand-mark small">N</span><span class="brand-copy"><strong>NEXO</strong><small>Financeiro</small></span></div>
  </header>
  <main class="auth-shell auth-shell-branded">
    <section class="auth-visual">
      <span class="auth-shape auth-shape-one"></span><span class="auth-shape auth-shape-two"></span><span class="auth-shape auth-shape-three"></span>
      <div class="auth-visual-content"><span class="auth-eyebrow">SEGURANÇA</span><h1>Seu acesso foi recuperado.<br>Agora escolha sua senha.</h1><p>A senha temporária serviu apenas para devolver o acesso à sua conta.</p></div>
    </section>
    <div class="auth-card-stack">
      <section class="auth-card">
        <span class="auth-card-kicker">Proteção da conta</span>
        <h1>Crie uma nova senha</h1>
        <p class="muted">Escolha uma senha com pelo menos 8 caracteres. Depois disso, a senha temporária deixa de ser necessária.</p>
        <form id="changePasswordForm" class="auth-form active">
          <label>Nova senha<input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>
          <label>Confirmar nova senha<input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Repita a nova senha"></label>
          <button id="changePasswordBtn" class="btn btn-primary btn-block" type="submit">Salvar nova senha</button>
        </form>
        <p id="changePasswordMessage" class="form-message"></p>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=6.0"></script>
  <script src="change-password.js?v=6.0"></script>
</body>
</html>
